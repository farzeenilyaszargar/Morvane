<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI orbit</title>
  <desc id="desc">Abstract orbital data rings around a bright enterprise AI core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071124"/>
      <stop offset="0.48" stop-color="#201446"/>
      <stop offset="1" stop-color="#073a4a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#05d9e8"/>
      <stop offset="0.58" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#050711" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="16" r="1.4" fill="#e6fbff" opacity="0.65"/>
      <circle cx="72" cy="42" r="1.1" fill="#8eeeff" opacity="0.55"/>
      <circle cx="45" cy="82" r="1" fill="#ffffff" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#stars)" opacity="0.75"/>
  <circle cx="625" cy="360" r="290" fill="url(#core)"/>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="610" cy="360" rx="420" ry="145" stroke="#05d9e8" stroke-width="3" opacity="0.72" transform="rotate(-14 610 360)"/>
    <ellipse cx="610" cy="360" rx="332" ry="110" stroke="#f8c14a" stroke-width="2" opacity="0.5" transform="rotate(12 610 360)"/>
    <ellipse cx="610" cy="360" rx="505" ry="185" stroke="#ffffff" stroke-width="1.4" opacity="0.22" transform="rotate(24 610 360)"/>
  </g>
  <g fill="#ffffff">
    <rect x="508" y="258" width="72" height="72" opacity="0.86"/>
    <rect x="596" y="258" width="72" height="72" fill="#05d9e8"/>
    <rect x="684" y="258" width="72" height="72" opacity="0.86"/>
    <rect x="508" y="346" width="72" height="72" fill="#8b5cf6"/>
    <rect x="596" y="346" width="72" height="72" opacity="0.95"/>
    <rect x="684" y="346" width="72" height="72" fill="#38e8a4"/>
  </g>
  <path d="M170 598h860" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <path d="M170 638h520" stroke="#05d9e8" stroke-width="4" opacity="0.75"/>
</svg>
