<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI chip map</title>
  <desc id="desc">Glowing processor grid floating over a deep space field.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030815"/>
      <stop offset="0.55" stop-color="#071a33"/>
      <stop offset="1" stop-color="#06445a"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0v52" fill="none" stroke="#86f7ff" stroke-width="1" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <g transform="translate(280 120)">
    <rect x="0" y="0" width="640" height="440" rx="18" fill="#09182d" stroke="#95f5ff" stroke-width="3"/>
    <rect x="98" y="74" width="444" height="292" rx="10" fill="#0f2748" stroke="#05d9e8" stroke-width="2"/>
    <g fill="#05d9e8">
      <rect x="138" y="114" width="82" height="82" opacity="0.95"/>
      <rect x="278" y="114" width="82" height="82" opacity="0.58"/>
      <rect x="418" y="114" width="82" height="82" opacity="0.82"/>
      <rect x="138" y="240" width="82" height="82" opacity="0.45"/>
      <rect x="278" y="240" width="82" height="82" opacity="0.94"/>
      <rect x="418" y="240" width="82" height="82" opacity="0.55"/>
    </g>
    <g stroke="#8b5cf6" stroke-width="10" stroke-linecap="square">
      <path d="M-66 70H0M-66 150H0M-66 230H0M-66 310H0M640 70h66M640 150h66M640 230h66M640 310h66"/>
      <path d="M90-66v66M190-66v66M290-66v66M390-66v66M490-66v66M90 440v66M190 440v66M290 440v66M390 440v66M490 440v66"/>
    </g>
  </g>
  <circle cx="210" cy="600" r="3" fill="#fff"/>
  <circle cx="1040" cy="125" r="2" fill="#fff"/>
  <circle cx="1020" cy="598" r="4" fill="#05d9e8"/>
</svg>
